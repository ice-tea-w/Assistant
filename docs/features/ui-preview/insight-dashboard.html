<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Assistant · 数据看板插件视觉稿</title>
<style>
  :root{
    --canvas:#0a0c10; --win:#171a1f; --nav:#1b1f25; --surface:#1d2127;
    --surface2:#242a32; --surface3:#2c333d; --text:#e9ecf1; --text2:#aab3c0; --text3:#808a99;
    --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.13);
    --accent:#6e8dff; --accent2:#9b7bff; --soft:rgba(110,141,255,.14);
    --success:#45c48c; --warn:#eeb154; --danger:#ef6b6b;
    --tile-doc:#7d9bff; --tile-vid:#b49bff; --tile-zip:#f0bd72; --tile-other:#6f7a8a;
    --shadow:0 34px 90px rgba(0,0,0,.68);
  }
  .theme-light{
    --win:#f7f8fb; --nav:#f1f4f9; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e4e9f1;
    --text:#151a22; --text2:#525d6e; --text3:#6b7585;
    --line:rgba(20,29,45,.08); --line2:rgba(20,29,45,.14);
    --accent:#2f5fe0; --accent2:#6f49e8; --soft:rgba(47,95,224,.10);
    --success:#159a63; --warn:#b57311; --danger:#d14848;
    --tile-doc:#2f5fe0; --tile-vid:#6b4ce0; --tile-zip:#a2650d; --tile-other:#8791a1;
    --shadow:0 26px 60px rgba(28,38,58,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:1760px;height:840px;overflow:hidden;background:
    radial-gradient(900px 500px at 8% -8%, rgba(110,141,255,.10), transparent 62%),
    radial-gradient(900px 500px at 92% 4%, rgba(155,123,255,.08), transparent 60%),var(--canvas);
    color:var(--text);font-family:"MiSans","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
    -webkit-font-smoothing:antialiased}
  .head{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
  .head-left{display:flex;align-items:center;gap:14px}
  .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#6e8dff,#9b7bff);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;
    box-shadow:0 6px 18px rgba(110,141,255,.35),inset 0 1px 0 rgba(255,255,255,.35)}
  .title{font-size:17px;font-weight:600;color:#eef1f6}
  .sub{font-size:11px;color:#788394;margin-top:3px}
  .head-right{font-size:11px;color:#6f7a8a;text-align:right;line-height:1.7}
  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;
    border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);font-size:10px;color:#9aa6b8;margin-left:8px}
  .dot{width:5px;height:5px;border-radius:50%;background:#45c48c}

  .boards{display:flex;gap:32px;padding:0 32px}
  .board{width:820px;padding:26px;border-radius:24px;background:
    radial-gradient(680px 380px at 12% 0%,rgba(110,141,255,.10),transparent 64%),
    linear-gradient(180deg,#101319,#0c0f14 74%);
    border:1px solid rgba(255,255,255,.055);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
  .board.theme-light{background:
    radial-gradient(680px 380px at 12% 0%,rgba(58,107,240,.10),transparent 62%),
    linear-gradient(180deg,#e9edf5,#dfe5ef 76%);
    border-color:rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 18px 40px rgba(10,14,22,.12)}
  .board-head{height:24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px}
  .board-name{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.14em;color:#8d99aa;font-weight:600}
  .theme-light .board-name{color:#68758a}
  .bdot{width:7px;height:7px;border-radius:50%;background:#6e8dff;box-shadow:0 0 0 4px rgba(110,141,255,.14)}
  .theme-light .bdot{background:#2f5fe0}
  .board-size{font-size:9px;color:#5d6878;letter-spacing:.06em}

  .panel{width:760px;height:520px;border-radius:16px;overflow:hidden;background:var(--win);
    border:1px solid var(--line2);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05)}
  .titlebar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand-mark{width:21px;height:21px;border-radius:6px;background:linear-gradient(145deg,#6e8dff,#9b7bff);
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
  .brand-name{font-size:11px;font-weight:600;color:var(--text)}
  .tsep{width:1px;height:12px;background:var(--line2)}
  .tpage{font-size:10px;color:var(--text3)}
  .win-ctrls{display:flex;gap:2px}
  .wc{width:34px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px}
  .body{height:475px;display:flex;padding:10px;gap:10px}
  .nav{width:158px;height:455px;border-radius:12px;background:var(--nav);border:1px solid var(--line);padding:12px 9px 9px;display:flex;flex-direction:column}
  .ng{font-size:9px;font-weight:600;letter-spacing:.13em;color:var(--text3);padding:7px 8px 5px}
  .ng:first-child{padding-top:2px}
  .ni{height:34px;border-radius:8px;display:flex;align-items:center;gap:9px;padding:0 9px;font-size:12px;color:var(--text2);margin-bottom:2px}
  .ni .ico{width:15px;text-align:center;color:var(--text3);font-size:13px}
  .ni.on{background:var(--soft);color:var(--accent);font-weight:600}
  .ni.on .ico{color:var(--accent)}
  .nbadge{margin-left:auto;min-width:17px;height:17px;border-radius:9px;background:var(--soft);color:var(--accent);
    font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .nplug{font-size:8px;color:var(--text3);border:1px solid var(--line2);border-radius:4px;padding:1px 4px;margin-left:auto}
  .spacer{flex:1}
  .nfoot{display:flex;justify-content:space-between;padding:6px 8px 0;font-size:9px;color:var(--text3)}

  .page{padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px;height:455px}
  .phead{height:32px;display:flex;align-items:center;justify-content:space-between}
  .ptitle{font-size:19px;font-weight:600;color:var(--text);letter-spacing:-.01em}
  .psub{font-size:9px;color:var(--text3);margin-top:3px}
  .range{display:flex;gap:3px;align-items:center}
  .rchip{height:24px;padding:0 9px;border-radius:12px;font-size:9px;color:var(--text2);display:flex;align-items:center}
  .rchip.on{background:var(--soft);color:var(--accent);border:1px solid rgba(110,141,255,.35);font-weight:600}
  .kpis{display:flex;gap:8px;height:50px}
  .kpi{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;justify-content:center}
  .klabel{font-size:8px;color:var(--text3);letter-spacing:.04em}
  .kval{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}
  .kval small{font-size:8px;color:var(--text3);font-weight:400;margin-left:3px}
  .kdelta{font-size:8px;color:var(--success)}
  .grid{display:flex;gap:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:flex;flex-direction:column}
  .chair{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .ct{font-size:9px;color:var(--text2);font-weight:600;letter-spacing:.02em}
  .cv{font-size:8px;color:var(--text3);font-variant-numeric:tabular-nums}
  .storage{width:263px;height:140px}
  .downloads{width:263px;height:140px}
  .activity{width:263px;height:96px}
  .kinds{width:263px;height:96px}
  .donut{position:relative;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) 0 68%,var(--surface3) 68% 100%);
    display:flex;align-items:center;justify-content:center;flex:none}
  .donut::after{content:"";width:40px;height:40px;border-radius:50%;background:var(--surface)}
  .dnum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font-size:13px;font-weight:600;color:var(--text)}
  .srow{display:flex;align-items:center;gap:9px;margin-top:2px}
  .slegend{flex:1;display:flex;flex-direction:column;gap:5px}
  .lg{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--text3)}
  .sw{width:6px;height:6px;border-radius:2px;background:var(--accent)}
  .sw2{background:var(--surface3)}
  .vol{margin-top:5px;display:flex;flex-direction:column;gap:3px}
  .vrow{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--text3)}
  .vbar{flex:1;height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
  .vfill{height:100%;border-radius:3px;background:var(--accent)}
  .vlabel{width:16px;color:var(--text2)}
  .vval{width:62px;text-align:right;font-variant-numeric:tabular-nums}

  .bars{flex:1;display:flex;align-items:flex-end;gap:3px;padding-top:4px;background:repeating-linear-gradient(to top,transparent 0 17px,var(--line) 17px 18px);border-radius:4px}
  .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:0;height:100%}
  .seg{width:100%;border-radius:2px 2px 0 0;min-height:1px}
  .seg.doc{background:var(--tile-doc)} .seg.vid{background:var(--tile-vid)} .seg.zip{background:var(--tile-zip)} .seg.other{background:var(--tile-other)}
  .axis{display:flex;justify-content:space-between;font-size:7px;color:var(--text3);margin-top:2px}
  .legend{display:flex;gap:7px;font-size:7px;color:var(--text3);margin-top:2px}
  .legend span{display:flex;align-items:center;gap:3px}

  .heat{display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(7,1fr);gap:2px;flex:1}
  .cell{border-radius:2px;background:var(--surface2)}
  .cell.l1{background:rgba(110,141,255,.18)} .cell.l2{background:rgba(110,141,255,.35)}
  .cell.l3{background:rgba(110,141,255,.55)} .cell.l4{background:var(--accent)}
  .hlegend{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:7px;color:var(--text3);margin-top:3px}
  .hc{width:6px;height:6px;border-radius:2px}

  .krow{display:flex;align-items:center;gap:5px;margin-top:3px}
  .kname{width:32px;font-size:8px;color:var(--text3)}
  .ktrack{flex:1;height:6px;border-radius:3px;background:var(--surface3);overflow:hidden}
  .kfill{height:100%;border-radius:3px}
  .kval2{width:38px;text-align:right;font-size:8px;color:var(--text3);font-variant-numeric:tabular-nums}
  .insight{height:20px;display:flex;align-items:center;gap:6px;font-size:8px;color:var(--text3)}
  .insight b{color:var(--text2);font-weight:600}
  .ibadge{height:16px;padding:0 6px;border-radius:8px;background:var(--soft);color:var(--accent);display:flex;align-items:center;font-size:7px}
</style>
</head>
<body>
<div class="head">
  <div class="head-left">
    <div class="mark">A</div>
    <div><div class="title">Assistant · 数据洞察插件 <span class="pill"><span class="dot"></span>官方示例</span></div>
    <div class="sub">插件贡献页面 · 只读聚合指标 · 纯 QML 图表（无 QtCharts 依赖）</div></div>
  </div>
  <div class="head-right">视觉稿 v0.1 · 2026-11-19<br>主面板 760 × 520 · 内容区 572 × 455</div>
</div>
<div class="boards">
  <section class="board" data-theme="dark">
    <div class="board-head"><div class="board-name"><span class="bdot"></span>DARK · 深色主题</div><div class="board-size">PLUGIN PAGE / 30 DAYS</div></div>
    <div class="slot"></div>
  </section>
  <section class="board theme-light" data-theme="light">
    <div class="board-head"><div class="board-name"><span class="bdot"></span>LIGHT · 浅色主题</div><div class="board-size">SAME TOKENS / HOST.isDark</div></div>
    <div class="slot"></div>
  </section>
</div>

<template id="tpl">
  <div class="panel">
    <div class="titlebar">
      <div class="brand"><div class="brand-mark">A</div><span class="brand-name">Assistant</span><span class="tsep"></span><span class="tpage">数据看板</span></div>
      <div class="win-ctrls"><div class="wc">—</div><div class="wc">□</div><div class="wc">×</div></div>
    </div>
    <div class="body">
      <aside class="nav">
        <div class="ng">工作台</div>
        <div class="ni"><span class="ico">☑</span>待办事项</div>
        <div class="ni"><span class="ico">▤</span>记事本</div>
        <div class="ni"><span class="ico">▤</span>剪贴板</div>
        <div class="ng">效率</div>
        <div class="ni"><span class="ico">↓</span>最近下载<span class="nbadge">7</span></div>
        <div class="ni"><span class="ico">⟳</span>设备同步</div>
        <div class="ni on"><span class="ico">▥</span>数据看板<span class="nplug">插件</span></div>
        <div class="ni"><span class="ico">⬡</span>插件市场</div>
        <div class="spacer"></div>
        <div class="nfoot"><span>v0.3.0</span><span>深色/浅色</span></div>
      </aside>
      <main class="page">
        <div class="phead">
          <div><div class="ptitle">数据看板</div><div class="psub">本机 · 只读聚合 · 每 30 秒刷新</div></div>
          <div class="range"><div class="rchip">7 天</div><div class="rchip on">30 天</div><div class="rchip">90 天</div></div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="klabel">磁盘已用</div><div class="kval">68% <small>412 / 604 GB</small></div><div class="kdelta">C: 剩余 192 GB</div></div>
          <div class="kpi"><div class="klabel">本期下载</div><div class="kval">12.4 GB <small>86 个</small></div><div class="kdelta">↑ 18% 对比上期</div></div>
          <div class="kpi"><div class="klabel">待整理收件箱</div><div class="kval">7 个 <small>1.8 GB</small></div><div class="kdelta">最久滞留 3 天</div></div>
        </div>
        <div class="grid">
          <div class="card storage"><div class="chair"><span class="ct">存储容量</span><span class="cv">C: / D:</span></div>
            <div class="srow"><div class="donut"><span class="dnum">68%</span></div><div class="slegend"><div class="lg"><span class="sw"></span>已用 412 GB</div><div class="lg"><span class="sw sw2"></span>可用 192 GB</div></div></div>
            <div class="vol"><div class="vrow"><span class="vlabel">C:</span><div class="vbar"><div class="vfill" style="width:74%"></div></div><span class="vval">301/407 GB</span></div>
              <div class="vrow"><span class="vlabel">D:</span><div class="vbar"><div class="vfill" style="width:56%"></div></div><span class="vval">111/197 GB</span></div></div>
          </div>
          <div class="card downloads"><div class="chair"><span class="ct">下载量 · 近 14 天</span><span class="cv">12.4 GB / 86 个</span></div>
            <div class="bars" id="bars"></div>
            <div class="axis"><span>11-06</span><span>11-13</span><span>11-19</span></div>
            <div class="legend"><span><i class="sw" style="background:var(--tile-doc)"></i>文档</span><span><i class="sw" style="background:var(--tile-vid)"></i>视频</span><span><i class="sw" style="background:var(--tile-zip)"></i>压缩</span></div>
          </div>
        </div>
        <div class="grid">
          <div class="card activity"><div class="chair"><span class="ct">活跃度 · 12 周</span><span class="cv">搜索 / 下载 / 笔记</span></div>
            <div class="heat" id="heat"></div><div class="hlegend">少<span class="hc" style="background:var(--surface2)"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span>多</div>
          </div>
          <div class="card kinds"><div class="chair"><span class="ct">索引文件类型</span><span class="cv">31,845 个</span></div>
            <div class="krow"><span class="kname">文档</span><div class="ktrack"><div class="kfill" style="width:62%;background:var(--tile-doc)"></div></div><span class="kval2">9.8k</span></div>
            <div class="krow"><span class="kname">图片</span><div class="ktrack"><div class="kfill" style="width:48%;background:var(--tile-vid)"></div></div><span class="kval2">7.6k</span></div>
            <div class="krow"><span class="kname">代码</span><div class="ktrack"><div class="kfill" style="width:34%;background:var(--tile-zip)"></div></div><span class="kval2">5.4k</span></div>
            <div class="krow"><span class="kname">压缩</span><div class="ktrack"><div class="kfill" style="width:18%;background:var(--tile-other)"></div></div><span class="kval2">2.9k</span></div>
          </div>
        </div>
        <div class="insight"><span class="ibadge">洞察</span><span>本月自动归档 <b>42</b> 个文件，找出 <b>8</b> 个重复文件，可释放 <b>1.1 GB</b>；<b>3</b> 个下载已滞留超过 3 天。</span></div>
      </main>
    </div>
  </div>
</template>

<script>
  const tpl = document.getElementById('tpl');
  document.querySelectorAll('.slot').forEach(slot => slot.appendChild(tpl.content.cloneNode(true)));

  // 14 天的堆叠下载柱：文档 / 视频 / 压缩 / 其它（高度是演示值）
  const days = [
    [10,4,2,1],[16,6,3,1],[8,2,1,0],[22,8,4,2],[14,5,2,1],[6,1,1,0],[18,7,4,2],
    [12,9,3,1],[24,10,5,2],[9,3,2,0],[20,12,5,3],[26,9,6,2],[15,4,3,1],[11,6,2,1]
  ];
  document.querySelectorAll('.bars').forEach(box => {
    days.forEach(d => {
      const total = d.reduce((a,b)=>a+b,0);
      const col = document.createElement('div'); col.className = 'bcol';
      const segs = [['doc',d[0]],['vid',d[1]],['zip',d[2]],['other',d[3]]];
      segs.forEach(([k,v]) => {
        if (!v) return;
        const s = document.createElement('div'); s.className = 'seg '+k;
        s.style.height = (v/Math.max(...days.map(x=>x.reduce((a,b)=>a+b,0))) * 78) + 'px';
        col.appendChild(s);
      });
      box.appendChild(col);
    });
  });

  // 14 周 × 7 天，固定伪随机（截图稳定）
  let seed = 7;
  const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  document.querySelectorAll('.heat').forEach(box => {
    for (let i = 0; i < 14*7; ++i) {
      const cell = document.createElement('div'); const v = rand();
      cell.className = 'cell ' + (v > .88 ? 'l4' : v > .70 ? 'l3' : v > .48 ? 'l2' : v > .24 ? 'l1' : '');
      box.appendChild(cell);
    }
  });
</script>
</body>
</html>
